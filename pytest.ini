[pytest]
testpaths = tests
; Coverage is deliberately scoped to the four shared analysis modules; plotting
; is smoke-tested only and scripts 01-21 are import-checked, not covered.
;
; These are named as MODULES, not as scripts/*.py paths: coverage treats a
; non-directory --cov value as an importable name (coverage/inorout.py:219), so
; a file path silently measures nothing and reports 0%. scripts/ is on sys.path
; (see tests/conftest.py), so these four names resolve to exactly those files.
addopts = --cov=analysis_config --cov=analysis_io
          --cov=text_windows --cov=vectors
          --cov-report=term-missing --cov-fail-under=80 -m "not slow"
markers =
    slow: requires torch or network
